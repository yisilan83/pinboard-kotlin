name: Signed Build

on:
  push:
    tags:
      - '*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release with APK'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (e.g. v3.15.0-zh)'
        type: string
        required: false

permissions:
  contents: write

jobs:
  build-signed-apk:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Project Checkout
        uses: actions/checkout@v6

      - name: Setup Android Build
        uses: ./.github/actions/setup-android-build

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > ${{ github.workspace }}/keystore/release.jks

      - name: Build
        run: ./gradlew app:assembleRelease
        env:
          SIGN_BUILD: true
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: signed-apk
          path: app/build/outputs/apk/release/*.apk

      - id: version
        name: Get version info
        run: |
          VERSION_CODE=$(./gradlew -q app:printReleaseVersionCode | tail -n 1)
          VERSION_NAME=$(./gradlew -q app:printReleaseVersionName | tail -n 1)
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub release (tag trigger)
        if: ${{ github.ref_type == 'tag' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            app/build/outputs/apk/release/*.apk \
            --title="${{ github.ref_name }}" \
            --notes="自动构建的签名 APK，基于上游 v${{ steps.version.outputs.VERSION_NAME }}，包含中文语言支持。"

      - name: Create GitHub release (manual trigger)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag || format('v{0}-zh', steps.version.outputs.VERSION_NAME) }}"
          echo "Creating release: $TAG"
          gh release create "$TAG" \
            app/build/outputs/apk/release/*.apk \
            --title="$TAG" \
            --notes="自动构建的签名 APK，基于上游 v${{ steps.version.outputs.VERSION_NAME }}，包含中文语言支持。\n\n### 更新内容\n- 完整中文界面翻译\n- 与上游 v${{ steps.version.outputs.VERSION_NAME }} 同步" \
            --generate-notes=false


  build-signed-aab:
    name: Build Signed AAB
    runs-on: ubuntu-latest

    steps:
      - name: Project Checkout
        uses: actions/checkout@v6

      - name: Setup Android Build
        uses: ./.github/actions/setup-android-build

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > ${{ github.workspace }}/keystore/release.jks

      - name: Build
        run: ./gradlew app:bundleRelease
        env:
          SIGN_BUILD: true
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: signed-aab
          path: app/build/outputs/bundle/release/*.aab
          archive: false
