name: Sync Upstream & Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync from upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/fibelatti/pinboard-kotlin.git
          git fetch upstream --tags

      - name: Check for new upstream tags
        id: check_release
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v?[0-9]' | head -1 || echo "none")
          UPSTREAM_LATEST_TAG=$(git ls-remote --tags --refs upstream 'refs/tags/*' | sort -t/ -k3 -V | tail -1 | awk '{print $2}' | sed 's|refs/tags/||')
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "upstream_tag=$UPSTREAM_LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Current latest: $LATEST_TAG, Upstream latest: $UPSTREAM_LATEST_TAG"

      - name: Merge upstream main
        run: |
          git merge upstream/main --allow-unrelated-histories -m "Sync: merge upstream/main" || true

      - name: Push changes
        run: |
          git push origin main

      - name: Create tag for upstream release
        if: steps.check_release.outputs.upstream_tag != '' && steps.check_release.outputs.upstream_tag != steps.check_release.outputs.latest_tag
        run: |
          git tag "${{ steps.check_release.outputs.upstream_tag }}"
          git push origin "${{ steps.check_release.outputs.upstream_tag }}"

  build-signed-apk:
    name: Build Signed APK
    needs: sync
    runs-on: ubuntu-latest
    if: always() && needs.sync.result != 'failure'
    steps:
      - name: Project Checkout
        uses: actions/checkout@v6

      - name: Setup Android Build
        uses: ./.github/actions/setup-android-build

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > ${{ github.workspace }}/keystore/release.jks

      - name: Build
        run: ./gradlew app:assembleRelease
        env:
          SIGN_BUILD: true
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: signed-apk
          path: app/build/outputs/apk/release/*.apk
