name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync from upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/fibelatti/pinboard-kotlin.git
          git fetch upstream

      - name: Check for upstream releases
        id: check_release
        run: |
          LATEST_TAG=$(git ls-remote --tags --refs upstream 'refs/tags/v*' | sort -t/ -k3 -V | tail -1 | awk '{print $2}' | sed 's|refs/tags/||')
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest upstream tag: $LATEST_TAG"

      - name: Merge upstream main
        run: |
          git checkout main
          git merge upstream/main --allow-unrelated-histories || true

      - name: Push changes
        run: |
          git push origin main

      - name: Create PR for upstream release
        if: steps.check_release.outputs.latest_tag != ''
        run: |
          BRANCH_NAME="upstream-release-${{ steps.check_release.outputs.latest_tag }}"
          git checkout -b "$BRANCH_NAME"
          git merge upstream/main --allow-unrelated-histories || true
          git push origin "$BRANCH_NAME"

          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Sync: Upstream release ${{ steps.check_release.outputs.latest_tag }}" \
            --body "This PR syncs changes from upstream release ${{ steps.check_release.outputs.latest_tag }}.

            - Upstream: https://github.com/fibelatti/pinboard-kotlin/releases/tag/${{ steps.check_release.outputs.latest_tag }}

            Auto-created by the sync-upstream workflow." \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
